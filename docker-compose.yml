# FalkorDB is the source of truth for circe-graph: candidates, learned
# aliases, write-back memory. The app never keeps a parallel in-memory catalog.
# 6379 = database · 3000 = FalkorDB Browser (open http://localhost:3000 to see
# the graph the agent reasons over — pick graph "circe").
services:
  falkordb:
    # Pinned by digest: ":latest" could change Cypher behaviour mid-event.
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    container_name: circe-graph-falkordb
    restart: unless-stopped
    ports:
      # Loopback only — this database is local storage, not a public service.
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  falkordb-data:
